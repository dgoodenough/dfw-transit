name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate the plan and every scenario
        run: |
          python -m dfwt validate
          for s in scenarios/*/; do python -m dfwt validate --scenario "$(basename "$s")" || true; done
